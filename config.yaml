database:
  path: data/app.db
parser:
  command: mineru
  backend: pipeline
  timeout_seconds: 480
  output_dir: data/parsed
storage:
  upload_dir: data/uploads
llm:
  timeout_seconds: 60
  retries: 1
  providers:
    openai:
      api_key_env: PAPER_AGENT_API_KEY
      base_url: https://llmapi.paratera.com/v1
  tasks:
    glossary:
      provider: openai
      model: DeepSeek-V4-Pro-0813
      timeout_seconds: 180
      retries: 0
    translate:
      provider: openai
      model: DeepSeek-V4-Pro-0813
      timeout_seconds: 60
      retries: 1
glossary:
  max_source_chars: 14000
translation:
  strategy: llm
  batch_size: 4
  next_screen_blocks: 12
  chinese_ratio_threshold: 0.4
  event_buffer_size: 256
